name = "cdot"
version = "0.1.0"
defaultTargets = ["CDot", "CDotFCCT"]

[leanOptions]
autoImplicit = true
linter.unusedVariables = false
pp.unicode.fun = true

[[require]]
name = "fcct"
path = "../external/ctml/fcct/lean"

[[require]]
name = "ctmlcore"
path = "../external/ctml/lean/CTMLCore"

# Keep Mathlib last so its cached dependency versions take precedence over
# manifests of local dependencies built with an older standalone toolchain.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "CDot"

[[lean_lib]]
name = "CDotFCCT"
