name = "cdot"
version = "0.1.0"
defaultTargets = ["CDot"]

[leanOptions]
autoImplicit = true
linter.unusedVariables = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "fcct"
path = "../external/ctml/fcct/lean"

[[lean_lib]]
name = "CDot"
